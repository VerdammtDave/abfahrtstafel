<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abfahrtstafel</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000080">
<style>
  :root {
    --navy: #000080; --yellow: #ffff00; --white: #fff; --late: #ffa500;
    --bar-bg: #00005c; --line: #00005c; --zeit-bg: #fff; --zeit-fg: var(--navy);
    --head-bg: var(--yellow); --head-fg: #000;
    --accent: var(--yellow); --tab-ind: var(--yellow); --tab-on: var(--navy);
    --chip-ind: var(--white); --chip-on: var(--navy); --ring: rgba(255,255,0,.35);
    --st-yellow: var(--yellow); --st-orange: #ff9900; --st-red: #ff3b30; --star: var(--yellow);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--navy); color: var(--white); font-family: Arial, Helvetica, sans-serif; }
  button { font-family: inherit; cursor: pointer; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent;
    transition: transform .2s cubic-bezier(.22,1,.36,1), color .3s ease, border-color .3s ease, background-color .3s ease, box-shadow .3s ease; }
  button:active { transform: scale(.95) !important; }

  /* Umschalter: Der gewählte Knopf blendet weich in seine Farbe, der alte blendet aus. */
  .switch { display: inline-flex; gap: 10px; align-items: center; }

  /* Animationen */
  .bar button:hover, .foot button:hover, .back:hover { transform: translateY(-2px); }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.6) rotate(-12deg); } 100% { transform: scale(1); } }
  .pop { animation: pop .5s cubic-bezier(.22,1,.36,1); }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  .bar > * { animation: drop .6s cubic-bezier(.22,1,.36,1) backwards; }
  .bar > :nth-child(2) { animation-delay: .07s; } .bar > :nth-child(3) { animation-delay: .14s; }
  .bar > :nth-child(4) { animation-delay: .21s; } .bar > :nth-child(5) { animation-delay: .28s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Aktualisieren: runder Knopf oben, Symbol dreht sich beim Laden */
  .bar .refresh { flex: none; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center;
    color: var(--tab-on); background: linear-gradient(135deg, var(--accent), var(--accent-2, var(--accent)));
    box-shadow: 0 4px 14px var(--ring), inset 0 1px 0 rgba(255,255,255,.35); }
  .refresh svg { transition: transform .5s cubic-bezier(.22,1,.36,1); }
  .bar .refresh:hover { box-shadow: 0 6px 20px var(--ring), inset 0 1px 0 rgba(255,255,255,.35); }
  .refresh:hover svg { transform: rotate(180deg); }
  .refresh:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .refresh.loading svg { animation: spin .8s linear infinite; }
  #themes .ico { display: inline-block; }
  #themes .chip.active .ico { animation: icospin .7s cubic-bezier(.22,1,.36,1); }
  @keyframes icospin { 0% { transform: rotate(-200deg) scale(.4); opacity: 0; } 60% { transform: rotate(15deg) scale(1.25); opacity: 1; } 100% { transform: none; } }
  #favCount { display: inline-block; }
  .search input { transition: box-shadow .25s, border-color .25s, background-color .25s; }
  .search input:focus { outline: none; box-shadow: 0 0 0 4px var(--ring); }
  /* Designwechsel: kurzes Überblenden des ganzen Bildes statt hunderter einzelner Übergänge */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .18s; }
  @media (prefers-reduced-motion: reduce) {
    *:not(.mq), *:not(.mq)::before, *:not(.mq)::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  .bar { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--bar-bg); flex-wrap: wrap; }
  .bar .tab { background: none; border: 2px solid var(--yellow); color: var(--yellow); font-size: 16px; font-weight: bold; padding: 4px 12px; }
  .bar .tab.active { background: var(--tab-ind); color: var(--tab-on); }
  #chips { margin-left: auto; }
  /* Menü: ein Knopf rechts statt vieler einzelner Chips. Darin Konto, Einstellungen, Updates, Abmelden und die Darstellung. */
  .menuwrap { position: relative; }
  .menubtn { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 20px; line-height: 1;
    background: var(--surface, rgba(255,255,255,.1)); color: var(--white); border: 1px solid var(--border, rgba(255,255,255,.3)); }
  .menubtn[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .menubtn .avatar { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 700;
    background: var(--accent); color: var(--tab-on); }
  .menupanel { position: absolute; right: 0; top: calc(100% + 10px); width: 280px; z-index: 40; padding: 8px; border-radius: 16px;
    background: var(--card, var(--navy)); border: 1px solid var(--border, rgba(255,255,255,.3)); box-shadow: var(--shadow, 0 12px 32px rgba(0,0,0,.5)); }
  .menuuser { display: flex; flex-direction: column; padding: 8px 10px 10px; border-bottom: 1px solid var(--line, rgba(255,255,255,.15)); margin-bottom: 6px; }
  .menuuser span { font-size: 12.5px; opacity: .65; }
  .menupanel .menuitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 10px 12px;
    border: 0; border-radius: 10px; background: none; color: var(--white); font-size: 15px; }
  .menupanel .menuitem:hover, .menupanel .menuitem:focus-visible { background: var(--surface-hi, rgba(255,255,255,.12)); outline: none; }
  .menupanel .menuitem.danger { color: #ff6b61; }
  .menuitem .ver { font-size: 12.5px; opacity: .6; }
  .menusec { margin: 10px 10px 6px; padding-top: 10px; border-top: 1px solid var(--line, rgba(255,255,255,.15)); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .65; }
  .themeseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 4px 4px; }
  .themeseg .chip { padding: 7px 4px; font-size: 13px; text-align: center; white-space: nowrap; }
  #acct.hidden + .menusec { margin-top: 2px; padding-top: 0; border-top: 0; }
  .search { position: relative; flex: 1 1 260px; max-width: 420px; }
  .search input { width: 100%; font: 16px Arial, sans-serif; padding: 5px 8px; border: 2px solid var(--white); background: var(--white); color: #000; border-radius: 0; }
  .suggest { position: absolute; left: 0; right: 0; top: 100%; background: var(--white); color: #000; z-index: 10; border: 2px solid var(--yellow); }
  .suggest button { display: block; width: 100%; text-align: left; font-size: 16px; padding: 6px 8px; border: 0; border-bottom: 1px solid #ccc; background: none; color: #000; }
  .suggest button:hover { background: var(--yellow); }
  .chip { background: none; border: 2px solid var(--white); color: var(--white); font-size: 14px; padding: 3px 10px; }
  .chip.active { background: var(--chip-ind); color: var(--chip-on); }

  .head { display: flex; align-items: center; padding: 4px 8px 4px 4px; min-height: 70px; gap: 12px; }
  .clock { font-size: 40px; font-weight: bold; width: 150px; font-variant-numeric: tabular-nums; }
  .head h1 { flex: 1; text-align: center; margin: 0; font-size: 36px; }
  .star { background: none; border: 0; color: var(--white); font-size: 40px; line-height: 1; width: 150px; text-align: right; }
  .star.on { color: var(--star); }

  .cols, .row { display: grid; grid-template-columns: 230px minmax(140px, 1.1fr) 2.4fr 110px; }
  .cols { background: var(--head-bg); color: var(--head-fg); font-size: 32px; font-weight: bold; height: 52px; align-items: center; }
  .cols div { padding: 0 6px 0 4px; }
  .cols div:last-child { text-align: right; padding-right: 8px; }

  .row { min-height: 72px; border-bottom: 1px solid var(--line); align-items: stretch; }
  .zeit { background: var(--zeit-bg); color: var(--zeit-fg); padding: 2px 4px 2px 0; }
  .zeit b { display: block; font-weight: normal; font-size: 32px; line-height: 38px; font-variant-numeric: tabular-nums; }
  .zeit small { font-size: 15px; display: block; line-height: 18px; white-space: nowrap; overflow: hidden; padding-left: 4px; }
  .nach { font-weight: bold; font-size: 25px; padding: 6px 8px 0 8px; align-self: start; line-height: 30px; }
  .ueber { font-size: 18px; padding: 10px 8px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: start; }
  .mq { display: inline-block; white-space: nowrap; }
  .mq .end { display: none; font-style: normal; color: var(--white); font-weight: normal; margin: 0 .7em; }
  .mq.run .end { display: inline; }
  .mq.run { animation: slide var(--dur) linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(var(--dist)); } }
  .gleis small { display: block; font-size: 13px; font-weight: normal; line-height: 14px; opacity: .75; }
  .cols .gh { font-size: 17px; line-height: 20px; }
  .gleis { font-weight: bold; font-size: 28px; text-align: right; padding: 6px 12px 0 0; overflow-wrap: anywhere; line-height: 30px; }
  .status { display: block; color: var(--st-yellow); font-size: 18px; line-height: 22px; }
  .status.orange { color: var(--st-orange); }
  .status.red { color: var(--st-red); }
  .cancel .nach, .cancel .zeit b { text-decoration: line-through; }
  .msg { padding: 24px 12px; font-size: 22px; }
  .foot { display: flex; align-items: center; justify-content: space-between; padding: 8px; font-size: 14px; }
  .foot button { background: none; border: 2px solid var(--white); color: var(--white); padding: 3px 10px; font-size: 14px; }
  .sep { height: 14px; background: var(--bar-bg); }
  .favlist .cols { font-size: 32px; }
  .favitem { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--white); text-align: left; font-size: 25px; font-weight: bold; padding: 18px 12px; }
  .favitem:hover, .favitem:focus-visible { background: var(--white); color: var(--navy); outline: none; }
  .favitem span { color: var(--yellow); font-size: 28px; }
  .favitem:hover span { color: var(--navy); }
  .back { margin: 8px; background: none; border: 2px solid var(--yellow); color: var(--yellow); font-size: 16px; font-weight: bold; padding: 4px 12px; }
  .hidden { display: none; }

  /* Telegram-Anbindung: Glocke an Fahrten, Anmeldefenster, Tracking-Liste */
  .bell { font-style: normal; font-size: 16px; margin-left: 6px; vertical-align: middle; opacity: .3; filter: grayscale(1); }
  .bell.on { opacity: 1; filter: none; }
  .row.trackable { cursor: pointer; }
  .alertlink { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  /* Das „i“ wird aus Punkt und Strich gezeichnet, damit es exakt mittig sitzt (Schriftzeichen haben eigene Abstände). */
  .alertlink.info { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box;
    text-decoration: none; margin-left: 8px; vertical-align: middle; width: 20px; height: 20px; border-radius: 50%;
    color: var(--zeit-fg); border: 1.5px solid currentColor; opacity: .75; transition: opacity .15s; }
  .alertlink.info::before, .alertlink.info::after { content: ""; background: currentColor; width: 2.5px; border-radius: 1px; }
  .alertlink.info::before { height: 2.5px; border-radius: 50%; }
  .alertlink.info::after { height: 7px; }
  .alertlink.info:hover { opacity: 1; }
  .modal .altext { text-align: left; white-space: pre-line; margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: var(--surface, rgba(255,255,255,.08)); font-size: 14px; max-height: 40vh; overflow: auto; }
  .modal .alhead { margin: 0 0 8px; font-size: 17px; }
  .modal .card.trip { width: min(560px, calc(100% - 24px)); max-width: none; text-align: left; max-height: min(90vh, 900px); overflow: auto; padding: 22px 24px; }
  .modal .card.wide { width: min(780px, calc(100% - 24px)); max-width: none; text-align: left; max-height: min(92vh, 960px); overflow: auto; padding: 24px 28px; }
  .modal .card.wide .setsec { padding: 16px 0; }
  .memlist { border: 1px solid var(--border, rgba(255,255,255,.2)); border-radius: 12px; overflow: hidden; }
  .memlist .memrow { display: grid; grid-template-columns: minmax(0, 1fr) 150px 44px; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line, rgba(255,255,255,.12)); }
  .memlist .memrow:last-child { border-bottom: 0; }
  .memrow .who { min-width: 0; overflow-wrap: anywhere; }
  .rolecell { min-width: 0; }
  .rolesel { width: 100%; background: var(--surface, rgba(255,255,255,.1)); color: var(--white); border: 1px solid var(--border, rgba(255,255,255,.3)); border-radius: 10px;
    padding: 7px 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .rolesel:disabled { opacity: .5; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-hi, rgba(255,255,255,.12)); }
  .badge.besitzer { background: var(--accent); color: var(--tab-on); }
  .hammer-ph { width: 40px; }
  .inv { display: flex; }
  @media (max-width: 560px) {
    .modal .card.wide { padding: 18px 16px; width: calc(100% - 16px); max-height: 94vh; }
    .memlist .memrow { grid-template-columns: minmax(0, 1fr) 40px; row-gap: 8px; }
    .memlist .memrow .rolecell { grid-column: 1; grid-row: 2; }
    .memlist .memrow .hammer, .memlist .memrow .hammer-ph { grid-column: 2; grid-row: 1 / span 2; }
    .setrow { flex-direction: column; align-items: stretch; }
    .num input { width: 100%; }
  }
  .modal .card.wide .alhead { font-size: 20px; margin: 0 0 6px; }
  .setsec { padding: 12px 0; border-top: 1px solid var(--border, rgba(255,255,255,.2)); }
  .setsec h4 { margin: 0 0 8px; font-size: 15px; }
  .setsec h5 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; opacity: .75; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0; flex-wrap: wrap; }
  .sw { display: flex; align-items: center; gap: 8px; }
  .fld { display: block; font-size: 14px; }
  .modal .card input[type=text], .modal .card input[type=number], .modal .card input[type=search], .modal .card input:not([type]) {
    background: var(--surface, rgba(255,255,255,.1)); color: var(--white); border: 1px solid var(--border, rgba(255,255,255,.3)); border-radius: 10px;
    padding: 8px 10px; font: inherit; font-size: 16px; }
  .fld input, #memQ { width: 100%; margin-top: 4px; }
  .num input { width: 84px; text-align: right; }
  .modal .card input:focus-visible, .modal .card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 12.5px; opacity: .75; margin: 6px 0 0; line-height: 1.4; }
  .setmsg { min-height: 20px; font-size: 14px; margin: 8px 0; }
  .setmsg.good { color: #3fb950; } .setmsg.bad { color: #ff6b61; } .setmsg.warn { color: var(--accent); }
  .setbtns { display: flex; gap: 8px; margin-bottom: 10px; }
  .modal .card button.primary { background: var(--accent); color: var(--tab-on); border-color: transparent; font-weight: 600; }
  .modal .card button.danger { color: #ff6b61; border-color: currentColor; }
  .modal .card button.hammer { background: #d92d20; color: #fff; border-color: #d92d20; font-weight: 700; }
  .modal .card button.hammer:hover { background: #b42318; }
  .modal .card button.hammer { min-width: 40px; padding: 6px 10px; font-size: 16px; line-height: 1; }
  .modal .card button.hammer.sure { box-shadow: 0 0 0 3px rgba(217,45,32,.45); transform: scale(1.1); }
  .modal .card button:disabled { opacity: .5; }
  .memrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line, rgba(255,255,255,.12)); flex-wrap: wrap; }
  .memrow .role { display: block; font-size: 12.5px; opacity: .7; }
  .memact { display: flex; gap: 6px; flex-wrap: wrap; }
  .memact button, .memrow + * button { margin-top: 0; }
  .hist { margin: 0; padding-left: 18px; font-size: 13px; opacity: .85; }
  .board .ueber[role="button"] { cursor: pointer; }
  .board .row:hover .ueber[role="button"] { text-decoration: underline dotted; text-underline-offset: 4px; }
  .tripbtn { display: none; margin: 6px 0 0; padding: 3px 10px; font-size: 12.5px; border-radius: 999px; background: var(--surface, rgba(255,255,255,.1)); color: var(--muted, inherit); border: 1px solid var(--border, rgba(255,255,255,.3)); }
  .modal .card .alhead .vz { margin-left: 8px; vertical-align: middle; font-size: 14px; }
  .vz.ok { color: #3fb950; }
  .tripsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 4px; }
  .tripsum div { padding: 10px 12px; border-radius: 12px; background: var(--surface, rgba(255,255,255,.08)); min-width: 0; }
  .tripsum span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }
  .tripsum b { display: block; margin-top: 2px; font-size: 15px; overflow-wrap: anywhere; }
  .tripsum small { font-size: 12.5px; opacity: .75; }
  .stops { list-style: none; margin: 8px 0 14px; padding: 0; }
  .stops li { position: relative; padding-left: 24px; }
  .stops li::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--border, rgba(255,255,255,.3)); }
  .stops li:first-child::before { top: 50%; } .stops li:last-child::before { bottom: 50%; }
  .stops li::after { content: ""; position: absolute; left: 2px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; box-sizing: border-box;
    background: var(--card, var(--navy)); border: 2px solid var(--muted, #aaa); }
  .stops li.here::after { background: var(--accent); border-color: var(--accent); }
  .stops li.past { opacity: .5; }
  .modal .card button.stoplink { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; width: 100%; margin: 0; padding: 8px 10px;
    text-align: left; border: 0; border-radius: 10px; background: none; color: inherit; font-size: 15px; }
  .modal .card button.stoplink:hover:not(:disabled) { background: var(--surface-hi, rgba(255,255,255,.12)); }
  .stoplink:disabled { cursor: default; }
  .stoplink .stime b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stoplink .stime b.late { color: var(--vz-o, var(--st-orange)); margin-right: 5px; }
  .stoplink .stime s { font-size: 12px; opacity: .6; }
  .stoplink em { font-style: normal; font-size: 11.5px; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--tab-on); }
  .stoplink .strack { font-size: 12.5px; opacity: .7; white-space: nowrap; }
  @media (max-width: 700px) {
    .tripbtn { display: block; width: fit-content; }
    .tripsum { grid-template-columns: 1fr; gap: 6px; }
    .tripsum div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .tripsum span { width: 60px; }
    .modal .card.trip { padding: 18px 14px; width: calc(100% - 16px); }
  }
  .modal .updlist { text-align: left; max-height: 55vh; overflow: auto; margin: 6px 0 10px; }
  .modal .upd { padding: 8px 0; border-top: 1px solid var(--border, rgba(255,255,255,.2)); }
  .modal .upd:first-child { border-top: 0; }
  .modal .upd b { font-size: 15px; margin-right: 8px; color: var(--accent); }
  .modal .upd span { font-size: 12px; opacity: .7; }
  .modal .upd ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
  .modal .alnote { margin: 0 0 6px; font-size: 13px; opacity: .8; }
  .modal .altext a { color: var(--accent); }
  .sub { display: block; font-size: 14px; font-weight: normal; line-height: 20px; opacity: .75; }
  .untrack { background: none; border: 1px solid currentColor; color: inherit; border-radius: 8px; font-size: 14px; padding: 2px 8px; line-height: 18px; opacity: .7; }
  .untrack:hover, .untrack:focus-visible { opacity: 1; }
  .track .cols, .track .row { grid-template-columns: 250px minmax(140px, 1.1fr) 2.4fr 150px; }
  .track .gleis { display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px; padding-right: 14px; }
  .track .gl { text-align: right; min-width: 40px; }
  .vz { font-size: 16px; font-weight: bold; margin-left: 10px; vertical-align: middle; color: var(--vz-y, var(--st-yellow)); }
  .alt { font-size: 15px; font-weight: normal; text-decoration: line-through; opacity: .7; margin-left: 8px; vertical-align: middle; }
  .zeit small .vz { font-size: inherit; margin: 0 6px 0 0; vertical-align: baseline; }
  .vz.orange { color: var(--vz-o, var(--st-orange)); }
  .vz.red { color: var(--vz-r, var(--st-red)); }
  .cancel .zeit .vz { text-decoration: none; opacity: 1; }
  .cancel .zeit .vz.alertlink { text-decoration: underline; }
  .favitem.plain { cursor: default; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal.hidden { display: none; }

const hhmm = iso => new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const kind = d => d.mode === 'BUS' ? 'bus' : 'bahn';

async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function fetchDepartures(id) {
  const data = await api(`/stoptimes?stopId=${encodeURIComponent(id)}&n=150`);
  return (data.stopTimes || []).map(st => {
    const p = st.place;
    const planned = p.scheduledDeparture || p.departure;
    const when = p.departure || planned;
    return {
      key: st.tripId + '|' + p.stopId,
      tripId: st.tripId,
      plannedWhen: planned,
      when,
      delay: (new Date(when) - new Date(planned)) / 1000,
      line: { name: st.displayName || st.routeShortName },
      mode: st.mode,
      direction: st.headsign,
      platform: p.track || '',
      cancelled: !!(st.cancelled || st.tripCancelled),
      stopName: p.name,
      alerts: activeAlerts([...(st.alerts || []), ...(p.alerts || [])], new Date(when))
    };
  });
}

// Meldungen (z. B. Streckensperrung), die zum Abfahrtszeitpunkt gelten. Nicht jede Fahrt hat welche, ein Ausfallgrund ist meist nicht dabei.
function activeAlerts(list, t) {
  const seen = new Set();
  return list.filter(a => {
    const per = a.impactPeriod?.length ? a.impactPeriod : a.communicationPeriod;
    const on = !per?.length || per.some(x => (!x.start || new Date(x.start) <= t) && (!x.end || new Date(x.end) >= t));
    const key = a.headerText || a.descriptionText;
    if (!on || !key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// Meldungstexte kommen als HTML: nur Text und Aufzählungen übernehmen
function plain(html) {
  const s = String(html || '').replace(/<\s*br\s*\/?>/gi, '\n').replace(/<\/(li|p|ul)>/gi, '\n').replace(/<li[^>]*>/gi, '• ');
  return (new DOMParser().parseFromString(s, 'text/html').body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}

function showAlerts(d) {
  if (!d?.alerts?.length) return;
  const items = d.alerts.map(a => `<div class="altext"><b>${esc(plain(a.headerText))}</b>${
    a.descriptionText ? '<br>' + esc(plain(a.descriptionText)) : ''}${
    /^https?:\/\//.test(a.url || '') ? `<br><a href="${esc(a.url)}" target="_blank" rel="noopener">Mehr Infos</a>` : ''}</div>`).join('');
  showModal(`<h3 class="alhead">${d.cancelled ? 'Fahrt fällt aus' : 'Meldung'} · ${esc(d.line?.name || '')} → ${esc(d.direction || '')}</h3>
    ${d.cancelled ? '<p class="alnote">Ein genauer Ausfallgrund wird meist nicht übermittelt. Das sind die Meldungen zu dieser Fahrt:</p>' : ''}
    ${items}<button id="loginCancel">Schließen</button>`);
}

const tripCache = new Map();           // tripId -> Fahrtabschnitt mit allen Halten

async function fetchTrip(tripId) {
  if (!tripCache.has(tripId)) {
    const { legs } = await api(`/trip?tripId=${encodeURIComponent(tripId)}`);
    tripCache.set(tripId, legs[0]);
  }
  return tripCache.get(tripId);
}

function goStop(id, name) {
  if (!id) return;
  closeModal(true);
  current = { id, name };
  store.set('current', current);
  $('#q').value = name;
  if (view !== 'board') setView('board'); else render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const clock = iso => iso ? hhmm(iso) : '';

function tripHtml(d, leg) {
  const stops = [leg.from, ...(leg.intermediateStops || []), leg.to];
  const here = Math.max(0, stops.findIndex(p => (d.stop?.id && p.stopId === d.stop.id) || p.name === d.stopName));
  // erster Halt zeigt die Abfahrt, alle anderen die Ankunft
  const times = stops.map((p, i) => {
    const plan = i === 0 ? p.scheduledDeparture || p.departure : p.scheduledArrival || p.arrival;
    const real = i === 0 ? p.departure || plan : p.arrival || plan;
    return { plan, real, late: plan && real ? Math.round((new Date(real) - new Date(plan)) / 60000) : 0 };
  });
  const first = stops[0], last = stops[stops.length - 1];
  const dur = times[0].real && times[times.length - 1].real ? Math.round((new Date(times[times.length - 1].real) - new Date(times[0].real)) / 60000) : 0;
  const delayMin = d.delay ? Math.round(d.delay / 60) : 0;
  const stand = d.cancelled ? '<span class="vz red">fällt aus</span>' : delayMin >= 1 ? `<span class="vz ${delayMin >= 15 ? 'red' : delayMin >= 5 ? 'orange' : ''}">+${delayMin} min</span>` : '<span class="vz ok">pünktlich</span>';
  const rest = stops.length - 1 - here;
  const items = stops.map((p, i) => {
    const t = times[i];
    const zeit = t.late >= 1 ? `<b class="late">${clock(t.real)}</b><s>${clock(t.plan)}</s>` : `<b>${clock(t.real || t.plan)}</b>`;
    const cls = i === here ? 'here' : i < here ? 'past' : '';
    return `<li class="${cls}"><button type="button" class="stoplink" data-id="${esc(p.stopId || '')}" data-name="${esc(p.name)}" ${p.stopId ? '' : 'disabled'}>
      <span class="stime">${zeit}</span><span class="sname">${esc(p.name)}${i === here ? ' <em>hier</em>' : ''}</span><span class="strack">${p.track ? esc(platformLabel(d.mode) + ' ' + p.track) : ''}</span></button></li>`;
  }).join('');
  return `<h3 class="alhead">${d.mode === 'BUS' ? '🚌' : '🚆'} ${esc(d.line?.name || '')} → ${esc(d.direction || last.name)} ${stand}</h3>
    <div class="tripsum">
      <div><span>Von</span><b>${esc(first.name)}</b><small>ab ${clock(times[0].real || times[0].plan)}</small></div>
      <div><span>Nach</span><b>${esc(last.name)}</b><small>an ${clock(times[times.length - 1].real || times[times.length - 1].plan)}</small></div>
      <div><span>Strecke</span><b>${stops.length} Halte${dur ? ' · ' + dur + ' min' : ''}</b><small>${rest > 0 ? rest + ' Halte nach ' + esc(d.stopName) : 'Endhaltestelle'}</small></div>
    </div>
    <p class="hint">Tippe auf eine Haltestelle, um ihre Abfahrten zu sehen.</p>
    <ol class="stops">${items}</ol>
    <button id="loginCancel">Schließen</button>`;
}

async function openTrip(d) {
  if (!d?.tripId) return;
  showModal('<p>Fahrt wird geladen …</p>', 'trip');
  try {
    showModal(tripHtml(d, await fetchTrip(d.tripId)), 'trip');
  } catch (e) {
    showModal(`<p>Die Fahrt konnte nicht geladen werden (${esc(e.message)}).</p><button id="loginCancel">Schließen</button>`);
  }
}

async function fetchVia(d) {
  if (viaCache.has(d.tripId)) return viaCache.get(d.tripId);
  const leg = await fetchTrip(d.tripId);
  const all = [leg.from, ...(leg.intermediateStops || []), leg.to].map(x => x.name);
  const i = all.indexOf(d.stopName);
  const via = all.slice(i + 1, -1).join(', ');       // ohne aktuellen Halt und Ziel
  viaCache.set(d.tripId, via);
  return via;
}

const MODE_NAMES = { BUS: 'Bus', TRAM: 'Tram', SUBWAY: 'U-Bahn', FERRY: 'Fähre' };
// Bus, Tram und Fähre halten am Steig, Zug und U-Bahn am Gleis
const platformLabel = m => ['BUS', 'TRAM', 'FERRY'].includes(m) ? 'Steig' : 'Gleis';
const modeName = m => MODE_NAMES[m] || 'Zug';

// an Folgetagen den Wochentag dazuschreiben
function dayTag(iso) {
  const dt = new Date(iso);
  return dt.toDateString() === new Date().toDateString() ? ''
    : ' · ' + dt.toLocaleDateString('de-DE', { weekday: 'short' });
}

// bei Verspätung steht die neue Zeit groß, daneben die geplante klein und durchgestrichen, darunter die Verspätung
const verspaetet = (delayMin, cancelled) => !cancelled && delayMin >= 1;
const zeitHtml = (planned, actual, delayMin, cancelled) => hhmm(verspaetet(delayMin, cancelled) ? actual : planned);
const altHtml = (planned, delayMin, cancelled) => verspaetet(delayMin, cancelled) ? `<s class="alt">${hhmm(planned)}</s>` : '';

function rowHtml(d, idx) {
  const planned = d.plannedWhen || d.when;
  const delayMin = d.delay ? Math.round(d.delay / 60) : 0;
  const ueber = esc(viaCache.get(d.tripId) ?? '');
  // Verspätung/Ausfall steht in einer eigenen Zeile unter der Laufschrift
  const sev = d.cancelled || delayMin >= 15 ? 'red' : delayMin >= 5 ? 'orange' : '';
  const hasAlert = !!d.alerts?.length;
  // Verspätung/Ausfall steht direkt neben der Uhrzeit; mit Meldung ist „fällt aus“ unterstrichen und anklickbar
  const vzText = d.cancelled ? 'fällt aus' : delayMin >= 1 ? `+${delayMin} min` : '';
  const vz = !vzText ? '' : d.cancelled && hasAlert
    ? `<span class="vz alertlink ${sev}" role="button" tabindex="0" title="Meldung anzeigen">${vzText}</span>`
    : `<span class="vz ${sev}" title="${d.cancelled ? '' : 'ca. ' + hhmm(d.when)}">${vzText}</span>`;
  const info = hasAlert ? '<i class="alertlink info" role="button" tabindex="0" title="Meldung anzeigen" aria-label="Meldung anzeigen"></i>' : '';   // neben der Uhrzeit, damit die Zeile nicht höher wird
  depByKey.set(d.key, d);
  const bell = session ? `<i class="bell ${tracked.has(d.key) ? 'on' : ''}" title="Fahrt im Telegram-Bot verfolgen">🔔</i>` : '';
  return `<div class="row ${d.cancelled ? 'cancel' : ''} ${session ? 'trackable' : ''}" data-idx="${idx}" data-key="${esc(d.key)}">
    <div class="zeit"><b>${zeitHtml(planned, d.when, delayMin, d.cancelled)}${altHtml(planned, delayMin, d.cancelled)}${info}${bell}</b><small>${vz}${esc(modeName(d.mode))} | ${esc(d.line?.name || '')}${dayTag(planned)}</small></div>
    <div class="nach">${esc(d.direction || '')}${d.tripId && !d.cancelled ? '<button type="button" class="tripbtn">Halte ›</button>' : ''}</div>
    <div class="ueber" ${d.tripId && !d.cancelled ? 'title="Alle Halte anzeigen" role="button" tabindex="0"' : ''}><span class="mq"><span class="seg">${ueber}<i class="end">+++</i></span></span></div>
    <div class="gleis">${d.platform ? `<small>${platformLabel(d.mode)}</small>${esc(d.platform)}` : ''}</div>
  </div>`;
}

function boardHtml(stop, deps, error, tag) {
  const list = (deps || []).filter(d => filter === 'all' || kind(d) === filter);
  const rows = error ? `<div class="msg">Fehler beim Laden: ${esc(error)}</div>`
    : !list.length ? '<div class="msg">Keine Abfahrten gefunden.</div>'
    : list.map(rowHtml).join('');
  return `<section class="board" data-tag="${tag}">
    <div class="head">
      <div class="clock">${new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</div>
      <h1>Abfahrt ${esc(stop.name)}</h1>
      <button class="star ${isFav(stop.id) ? 'on' : ''}" data-id="${esc(stop.id)}" data-name="${esc(stop.name)}"
        title="Favorit umschalten">${isFav(stop.id) ? '★' : '☆'}</button>
    </div>
    <div class="cols"><div>Zeit</div><div>Nach</div><div>Über</div><div class="gh">Gleis/Steig</div></div>
    <div class="rows">${rows}</div>
  </section>`;
}

// „Über“ asynchron nachladen, ohne die Tafel neu zu zeichnen
// Lange „Über“-Texte endlos durchlaufen lassen, getrennt durch „+++“
const MARQUEE_PX_PER_SEC = 30;
function marquee(cell) {
  const mq = cell.firstElementChild;
  if (!mq) return;
  mq.classList.remove('run');
  mq.querySelectorAll('.clone').forEach(c => c.remove());
  const seg = mq.firstElementChild;
  const avail = cell.clientWidth - 12;               // abzüglich Padding
  if (avail <= 0) return;
  mq.classList.add('run');                           // zeigt „+++“ für die Messung
  const w = seg.offsetWidth;
  if (w <= avail) return mq.classList.remove('run');
  const clone = seg.cloneNode(true);                 // zweite Kopie, damit der Übergang nahtlos ist
  clone.classList.add('clone');
  mq.appendChild(clone);
  mq.style.setProperty('--dist', -w + 'px');
  const dur = Math.round(w / MARQUEE_PX_PER_SEC * 10) / 10;
  mq.style.setProperty('--dur', dur + 's');
  mq.style.animationDelay = '-' + ((Date.now() / 1000) % dur).toFixed(2) + 's';   // gleiche Phase wie vor dem Neuzeichnen
}
const marqueeAll = () => document.querySelectorAll('.ueber').forEach(marquee);
window.addEventListener('resize', marqueeAll);

async function fillVia(el, list, myGen) {
  let next = 0;
  const worker = async () => {
    while (next < list.length && myGen === gen) {
      const i = next++, d = list[i];
      if (d.cancelled || !d.tripId) continue;
      try {
        await fetchVia(d);
        const cell = el.querySelector(`.row[data-idx="${i}"] .ueber`);
        if (cell && myGen === gen) {
          cell.innerHTML = rowHtml(d, i).match(/<div class="ueber"[^>]*>([\s\S]*?)<\/div>/)[1];
          marquee(cell);
        }
      } catch { /* Über bleibt leer, z. B. bei Netzwerkfehler */ }
    }
  };
  await Promise.all(Array.from({ length: VIA_PARALLEL }, worker));
}

async function load(stop, tag, myGen) {
  let deps = null, error = null;
  try { deps = await fetchDepartures(stop.id); deps.forEach(d => d.stop = stop); } catch (e) { error = e.message; }
  return { html: boardHtml(stop, deps, error, tag), deps };
}

let loads = 0;
async function render() {
  $('#refresh').classList.add('loading');
  loads++;
  try { await renderBoards(); } finally { if (--loads === 0) $('#refresh').classList.remove('loading'); }
}

async function renderBoards() {
  const myGen = ++gen;
  if (session) {
    await Promise.all([syncTrips(), view === 'favs' ? syncFavs(false) : null]);
    if (myGen !== gen) return;
  }
  if (view === 'tracking') {
    $('#out').innerHTML = trackingHtml();
    marqueeAll();
    return;
  }
  if (view === 'favs' && !favSel) {
    $('#out').innerHTML = favs.length
      ? `<div class="favlist"><div class="cols" style="grid-template-columns:1fr"><div>★ Favoriten</div></div>${
          favs.map(f => `<button class="favitem" data-id="${esc(f.id)}">${esc(f.name)}<span>›</span></button>`).join('')}</div>`
      : '<div class="msg">Noch keine Favoriten. Markiere Haltestellen mit ☆ auf der Abfahrten-Seite.</div>';
    return;
  }
  const stops = view === 'favs' ? [favSel] : current ? [current] : [];
  if (!stops.length) {
    $('#out').innerHTML = `<div class="msg">${view === 'favs'
      ? 'Noch keine Favoriten. Markiere Haltestellen mit ☆ auf der Abfahrten-Seite.'
      : 'Haltestelle oben suchen, um Abfahrten zu sehen.'}</div>`;
    return;
  }
  const results = await Promise.all(stops.map((s, i) => load(s, i, myGen)));
  if (myGen !== gen) return;
  const back = view === 'favs' ? '<button class="back">← Alle Favoriten</button>' : '';
  $('#out').innerHTML = back + results.map(r => r.html).join('<div class="sep"></div>');
  marqueeAll();
  $('#updated').textContent = 'Stand ' + new Date().toLocaleTimeString('de-DE') + ' · Daten: Transitous';
  results.forEach((r, i) => {
    if (!r.deps) return;
    const list = r.deps.filter(d => filter === 'all' || kind(d) === filter);
    fillVia($('#out').querySelectorAll('.board')[i], list, myGen);
  });
}

function toggleFav(id, name) {
  favs = isFav(id) ? favs.filter(f => f.id !== id) : [...favs, { id, name }];
  store.set('favs', favs);
  updateBadge(true);
  if (session) {
    const on = isFav(id);
    favSaving = favSaving.then(() => bot('POST', '/favs', { id, name, on })).catch(() => {});
  }
  if (view === 'board') {                          // Tafel nicht neu zeichnen, die Laufschrift läuft einfach weiter
    document.querySelectorAll('.star').forEach(el => {
      if (el.dataset.id !== id) return;
      const on = isFav(id);
      el.textContent = on ? '★' : '☆';
      el.classList.toggle('on', on);
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    });
    return;
  }
  if (favSel && favSel.id === id) favSel = null;   // entfernte Favoriten: zurück zur Liste
  render();
}

// ---------- Telegram-Anbindung (nur für verifizierte Nutzer des Bots) ----------
async function bot(method, path, body) {
  const headers = {};
  if (session) headers.Authorization = 'Bearer ' + session.token;
  if (body) headers['Content-Type'] = 'application/json';
  const r = await fetch(BOT_API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && session) { logout(true); throw new Error('abgemeldet'); }
  if (!r.ok) {
    const msg = (await r.json().catch(() => ({}))).error;      // verständliche Meldung des Bots, z. B. bei ungültigen Werten
    throw new Error(msg || 'HTTP ' + r.status);
  }
  return r.json();
}

// Formularwerte lesen und prüfen (der Bot prüft alles noch einmal selbst)
function readSettings() {
  const num = id => byId(id).value.trim() === '' ? NaN : Number(byId(id).value);
  const s = setCur;
  const out = { nick: byId('setNick').value.trim() || null, autoclear_on: byId('acOn').checked, autoclear_hours: num('acH'),
    remind_first: byId('rem1on').checked ? num('rem1') : null, remind_second: byId('rem2on').checked ? num('rem2') : null };
  let err = '';
  if (!Number.isInteger(out.autoclear_hours) || out.autoclear_hours < s.autoclear.min || out.autoclear_hours > s.autoclear.max)
    err = `Die Löschzeit muss eine ganze Zahl von ${s.autoclear.min} bis ${s.autoclear.max} Stunden sein.`;
  for (const [k, n] of [['remind_first', 1], ['remind_second', 2]])
    if (!err && out[k] !== null && (!Number.isInteger(out[k]) || out[k] < s.remind.min || out[k] > s.remind.max))
      err = `Die ${n}. Erinnerung muss eine ganze Zahl von ${s.remind.min} bis ${s.remind.max} Minuten sein.`;
  if (!err && out.remind_first && out.remind_second && out.remind_first <= out.remind_second)
    err = 'Die erste Erinnerung muss früher kommen als die zweite (mehr Minuten) und beide Zeiten müssen verschieden sein.';
  if (!err && out.nick && out.nick.length > 30) err = 'Der Name darf höchstens 30 Zeichen lang sein.';
  return { out, err };
}

function settingsChanged() {
  const { out } = readSettings(), s = setCur;
  return (out.nick || '') !== s.nick || out.autoclear_on !== s.autoclear.on || out.autoclear_hours !== s.autoclear.hours
    || out.remind_first !== s.remind.first || out.remind_second !== s.remind.second;
}

function fillSettings(s) {
  byId('setNick').value = s.nick;
  byId('acOn').checked = s.autoclear.on;
  byId('acH').value = s.autoclear.hours;
  for (const [n, v] of [[1, s.remind.first], [2, s.remind.second]]) {
    byId('rem' + n + 'on').checked = !!v;
    byId('rem' + n).value = v || s.remind.default[n - 1];
    byId('rem' + n).disabled = !v;
  }
}

function setMessage(text, kind) {
  const m = byId('setMsg');
  if (m) { m.textContent = text; m.className = 'setmsg ' + (kind || ''); }
}

function settingsGuard() {
  if (!setDirty || !byId('setForm')) return false;
  const m = byId('setMsg');
  m.className = 'setmsg warn';
  m.innerHTML = 'Es gibt ungespeicherte Änderungen. <button type="button" id="setDiscard">Verwerfen und schließen</button>';
  return true;
}
window.addEventListener('beforeunload', e => { if (setDirty) { e.preventDefault(); e.returnValue = ''; } });

document.addEventListener('input', e => {
  if (!e.target.closest('#setForm')) return;
  if (e.target.id === 'rem1on' || e.target.id === 'rem2on') byId(e.target.id.replace('on', '')).disabled = !e.target.checked;
  setDirty = settingsChanged();
  setMessage(setDirty ? 'Ungespeicherte Änderungen' : '', setDirty ? 'warn' : '');
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'setForm') return;
  e.preventDefault();
  const { out, err } = readSettings();
  if (err) return setMessage(err, 'bad');
  byId('setSave').disabled = true;
  try {
    setCur = await bot('POST', '/settings', out);
    fillSettings(setCur);
    setDirty = false;
    setMessage('Gespeichert. Gilt sofort auch in Telegram.', 'good');
  } catch (ex) {
    setMessage('Nicht gespeichert: ' + ex.message, 'bad');
  }
  byId('setSave').disabled = false;
});

document.addEventListener('click', e => {
  if (e.target.id === 'setReset') {
    fillSettings(setCur);
    setDirty = false;
    setMessage('Zurückgesetzt auf die gespeicherten Werte.', '');
  }
});

const ROLLEN = { verwalter: 'Verwalter', mitglied: 'Mitglied', gast: 'Gast' };
const memSay = (t, k) => { const m = byId('memMsg'); if (m) { m.textContent = t; m.className = 'setmsg ' + (k || ''); } };

function renderMembers() {
  const d = setAdmin, box = byId('memBox');
  if (!d || !box) return;
  const q = (byId('memQ').value || '').trim().toLowerCase();
  const rows = d.members.filter(m => !q || (m.name + ' ' + m.role).toLowerCase().includes(q)).map(m => {
    const aktuell = m.role.toLowerCase();
    // Dropdown nur, wenn man die Rolle dieser Person ändern darf. Sonst steht die Rolle als Schild da.
    const rolle = m.roles.length
      ? `<select class="rolesel" data-act="role" data-ref="${esc(m.ref)}" aria-label="Rolle von ${esc(m.name)}">${m.roles.map(r =>
          `<option value="${r}" ${r === aktuell ? 'selected' : ''}>${ROLLEN[r]}</option>`).join('')}</select>`
      : `<span class="badge ${aktuell}">${esc(m.role)}</span>`;
    const hammer = m.removable
      ? `<button type="button" class="hammer" data-act="remove" data-ref="${esc(m.ref)}" data-name="${esc(m.name)}" title="Rauswerfen" aria-label="${esc(m.name)} rauswerfen">🔨</button>`
      : '<span class="hammer-ph"></span>';
    return `<div class="memrow"><div class="who"><b>${esc(m.name)}</b>${m.invited_by ? `<span class="role">eingeladen von ${esc(m.invited_by)}</span>` : ''}</div>
      <div class="rolecell">${rolle}</div>${hammer}</div>`;
  }).join('') || '<p class="hint">Keine Treffer.</p>';
  const inv = d.invites.map(i => `<div class="memrow inv"><div class="who"><code>/code ${esc(i.code)}</code><span class="role">von ${esc(i.by)} · gültig bis ${when(i.expires)}</span></div>
    <div class="memact"><button type="button" data-act="copy" data-code="${esc(i.code)}">Kopieren</button><button type="button" data-act="revoke" data-code="${esc(i.code)}">Widerrufen</button></div></div>`).join('')
    || '<p class="hint">Keine offenen Einladungen.</p>';
  const hist = d.history.slice(0, 8).map(h => `<li>${esc(h.status)}${h.who ? ' (' + esc(h.who) + ')' : ''} · ${when(h.ts)}</li>`).join('');
  box.innerHTML = `<h5>Personen</h5><div class="memlist">${rows}</div>
    <h5>Einladungen</h5><button type="button" class="primary" data-act="invite">Neue Einladung erstellen</button>${inv}
    <p class="hint">Eine Einladung gilt 24 Stunden, nur einmal, und gibt nur Mitglieder-Zugang. Die Person schickt dem Bot die Zeile „/code …“.
    Rollen: Besitzer (genau einer), Verwalter (lädt ein und verwaltet Mitglieder und Gäste), Mitglied (nutzt den Bot), Gast (sieht nur per Code geteilte Verbindungen).
    Jede Rolle ändert nur Rollen unter sich, Verwalter ernennt nur der Besitzer.</p>
    ${hist ? '<h5>Verlauf</h5><ul class="hist">' + hist + '</ul>' : ''}<div id="memMsg" class="setmsg" role="status" aria-live="polite"></div>`;
}

document.addEventListener('change', async e => {
  const sel = e.target.closest('#memBox select[data-act="role"]');
  if (!sel) return;
  sel.disabled = true;
  try {
    setAdmin = await bot('POST', '/members/role', { ref: sel.dataset.ref, role: sel.value });
    renderMembers();
    memSay(setAdmin.message || 'Gespeichert', 'good');
  } catch (ex) {
    renderMembers();                                              // Auswahl zurück auf den echten Stand
    memSay(ex.message, 'bad');
  }
});

document.addEventListener('input', e => { if (e.target.id === 'memQ') renderMembers(); });

document.addEventListener('click', async e => {
  const b = e.target.closest('#memBox button[data-act]');
  if (!b) return;
  const act = b.dataset.act, say = (t, k) => { const m = byId('memMsg'); if (m) { m.textContent = t; m.className = 'setmsg ' + (k || ''); } };
  if (act === 'copy') {
    try { await navigator.clipboard.writeText('/code ' + b.dataset.code); say('Kopiert.', 'good'); } catch { say('Kopieren nicht möglich, bitte von Hand markieren.', 'bad'); }
    return;
  }
  if (act === 'remove' && b.dataset.sure !== '1') {               // erst nachfragen, dann entfernen
    b.dataset.sure = '1';
    b.classList.add('sure');
    say(`Noch einmal auf 🔨 klicken, um ${b.dataset.name} rauszuwerfen.`, 'warn');
    setTimeout(() => { if (b.isConnected) { b.dataset.sure = ''; b.classList.remove('sure'); } }, 4000);
    return;
  }
  b.disabled = true;
  try {
    const call = { invite: () => bot('POST', '/members/invite'),
      revoke: () => bot('DELETE', '/members/invite?code=' + encodeURIComponent(b.dataset.code)),
      remove: () => bot('DELETE', '/members?ref=' + encodeURIComponent(b.dataset.ref)) }[act];
    setAdmin = await call();
    renderMembers();
    say(setAdmin.message || '', 'good');
  } catch (ex) {
    b.disabled = false;
    say(ex.message, 'bad');
  }
});

function showModal(html, wide) {
  $('#modalBody').innerHTML = html;
  $('#modalBody').classList.toggle('wide', wide === true);
  $('#modalBody').classList.toggle('trip', wide === 'trip');
  $('#modal').classList.remove('hidden');
}
function closeModal(force) {
  if (!force && settingsGuard()) return;
  setDirty = false;
  $('#modal').classList.add('hidden');
  loginPoll = null;
}

let loginPoll = null;
async function login() {
  try {
    const { poll, link } = await bot('POST', '/login/start');
    loginPoll = poll;
    showModal(`<p>Öffne Telegram und bestätige dort die Anmeldung. Das geht nur mit einem Zugang zum Bot (Besitzer oder eingeladen).</p>
      <a class="go" href="${esc(link)}" target="_blank" rel="noopener">In Telegram öffnen</a>
      <p id="loginInfo">Warte auf Bestätigung …</p><button id="loginCancel">Abbrechen</button>`);
    const t0 = Date.now();
    while (loginPoll === poll && Date.now() - t0 < 600000) {
      await new Promise(r => setTimeout(r, 2000));
      if (loginPoll !== poll) return;
      const r = await bot('GET', '/login/poll?token=' + encodeURIComponent(poll));
      if (r.status === 'ok') {
        session = { token: r.session, name: r.name };
        store.set('session', session);
        closeModal();
        renderAcct();
        await syncFavs(true);
        return render();
      }
      if (r.status === 'expired') break;
    }
    if (loginPoll === poll) showModal('<p>Die Anmeldung ist abgelaufen.</p><button id="loginCancel">Schließen</button>');
  } catch (e) {
    showModal(`<p>Der Bot ist nicht erreichbar (${esc(e.message)}).</p><button id="loginCancel">Schließen</button>`);
  }
}

function logout(silent) {
  if (!silent && session) bot('POST', '/logout').catch(() => {});
  session = null;
  store.set('session', null);
  tracked = new Set();
  botTrips = null;
  renderAcct();
  if (view === 'tracking') setView('board'); else render();
}

async function syncFavs(merge) {
  if (!session) return;
  await favSaving;
  try {
    const r = merge ? await bot('POST', '/favs/merge', { favs }) : await bot('GET', '/favs');
    favs = r.favs;
    store.set('favs', favs);
    updateBadge();
  } catch { /* lokale Favoriten bleiben */ }
}

async function syncTrips() {
  if (!session) return;
  try {
    botTrips = await bot('GET', '/trips');
    tracked = new Set(botTrips.trips.map(t => t.key));
    $('#trackCount').textContent = botTrips.trips.length;
  } catch { /* Stand bleibt */ }
}

async function toggleTrack(row) {
  const d = depByKey.get(row.dataset.key);
  const bell = row.querySelector('.bell');
  if (!d || !d.stop || !bell) return;
  const on = !tracked.has(d.key);
  on ? tracked.add(d.key) : tracked.delete(d.key);
  bell.classList.toggle('on', on);
  bell.classList.remove('pop'); void bell.offsetWidth; bell.classList.add('pop');
  try {
    if (on) {
      await bot('POST', '/trips', {
        key: d.key, stop: d.stop.id, stop_name: d.stop.name, line: d.line?.name || '?',
        dest: d.direction || '–', kind: kind(d), planned: Date.parse(d.plannedWhen) / 1000,
        platform: d.platform || '', platform_label: platformLabel(d.mode),
        via: viaCache.get(d.tripId) || '', mode_name: modeName(d.mode)
      });
    } else {
      await bot('DELETE', '/trips?key=' + encodeURIComponent(d.key));
    }
    $('#trackCount').textContent = Math.max(0, +$('#trackCount').textContent + (on ? 1 : -1));
  } catch {
    on ? tracked.delete(d.key) : tracked.add(d.key);        // Änderung zurücknehmen
    bell.classList.toggle('on', !on);
  }
}

async function untrack(key) {
  try { await bot('DELETE', '/trips?key=' + encodeURIComponent(key)); } catch {}
  render();
}

function trackingHtml() {
  const trips = botTrips?.trips || [], routines = botTrips?.routines || [];
  if (!trips.length && !routines.length) {
    return '<div class="msg">Keine verfolgten Fahrten. In der Abfahrtstafel eine Fahrt antippen (🔔), Meldungen kommen in Telegram.</div>';
  }
  const rows = trips.map(w => {
    const delay = Math.round((w.eta - w.planned) / 60);
    const stand = w.cancelled ? 'fällt aus' : delay >= 1 ? `+${delay} min` : '';
    const sev = w.cancelled || delay >= 15 ? 'red' : delay >= 5 ? 'orange' : '';
    const art = w.mode_name ? w.mode_name + ' | ' : '';
    const status = stand ? `<span class="vz ${sev}" title="${w.cancelled ? '' : 'ca. ' + hhmm(w.eta * 1000)}">${esc(stand)}</span>` : '';
    return `<div class="row ${w.cancelled ? 'cancel' : ''}">
      <div class="zeit"><b>${zeitHtml(w.planned * 1000, w.eta * 1000, delay, w.cancelled)}${altHtml(w.planned * 1000, delay, w.cancelled)}</b><small>${status}${esc(art + w.line)}${dayTag(w.planned * 1000)}</small></div>
      <div class="nach">${esc(w.dest)}<span class="sub">${esc(w.stop_name)}</span></div>
      <div class="ueber"><span class="mq"><span class="seg">${esc(w.via || '')}<i class="end">+++</i></span></span></div>
      <div class="gleis"><span class="gl">${w.platform ? `<small>${esc(w.platform_label || 'Gleis')}</small>${esc(w.platform)}` : ''}</span><button class="untrack" data-key="${esc(w.key)}" title="Tracking beenden" aria-label="Tracking beenden">✕</button></div>
    </div>`;
  }).join('');
  const rep = routines.map(r =>
    `<div class="favitem plain">🔁 ${esc(r.hhmm)} ${esc(r.line)} → ${esc(r.dest)} · ${esc(r.days)}</div>`).join('');
  return `<div class="favlist track">
    <div class="cols"><div>Zeit</div><div>Nach</div><div>Über</div><div class="gh">Gleis/Steig</div></div>${rows || '<div class="msg">Keine einzelnen Fahrten.</div>'}
    ${rep ? '<div class="cols" style="grid-template-columns:1fr"><div>🔁 Wiederkehrend (im Bot einrichten)</div></div>' + rep : ''}
  </div>`;
}

document.addEventListener('click', e => {
  if (e.target.closest('#login')) login();
  else if (e.target.closest('#logout')) askLogout();
  else if (e.target.closest('#logoutYes')) { closeModal(true); logout(); }
  else if (e.target.closest('.stoplink')) goStop(e.target.closest('.stoplink').dataset.id, e.target.closest('.stoplink').dataset.name);
  else if (e.target.closest('#updatesBtn')) showUpdates();
  else if (e.target.closest('#settingsBtn')) showSettings();
  else if (e.target.closest('#setDiscard')) closeModal(true);
  else if (e.target.closest('#loginCancel') || e.target === $('#modal')) closeModal();
});

// Aktiven Knopf eines Umschalters wechseln
function setActive(group, btn) {
  group.querySelectorAll(':scope > button').forEach(x => x.classList.toggle('active', x === btn));
}

// Darstellung: klassisch / dunkel / hell
function applyTheme(t, save) {
  const root = document.documentElement;
  const apply = () => {
    root.setAttribute('data-theme', t);
    root.setAttribute('data-ui', 'modern');
    setActive($('#themes'), document.querySelector(`#themes .chip[data-theme="${t}"]`));
    marqueeAll();
  };
  if (save) try { localStorage.setItem('theme', t); } catch {}
  if (save && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(apply);
  else apply();
}
document.querySelectorAll('#themes .chip').forEach(b =>
  b.addEventListener('click', () => applyTheme(b.dataset.theme, true)));

applyTheme(document.documentElement.getAttribute('data-theme'), false);
if (!BOT_API) session = null;
renderAcct();
updateBadge();
if (current) $('#q').value = current.name;
setView(favs.length && !current ? 'favs' : 'board');
</script>
</body>
</html>
