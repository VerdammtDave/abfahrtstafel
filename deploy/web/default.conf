# Docker-DNS erst bei Bedarf auflösen, damit nginx auch ohne Bot-Container startet
resolver 127.0.0.11 valid=10s ipv6=off;
# Echte Client-IP hinter dem Proxy (Coolify/Traefik), damit der Bot pro IP drosseln kann
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    include /etc/nginx/csp.inc;

    # Wichtig: add_header in einem location ersetzt die Header des Servers. Darum hier alles wiederholen,
    # sonst bekommt die Startseite (/ wird intern zu /index.html) keine Sicherheitsheader.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        include /etc/nginx/csp.inc;
    }

    location /api/ {
        set $bot http://bot:8787;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $bot;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }

    location / { try_files $uri $uri/ =404; }
}
