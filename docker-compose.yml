# Website + Bot hinter EINER Adresse (in Coolify als "Docker Compose" einrichten, siehe docs/Docker-Coolify.md).
# Die Website leitet /api intern an den Bot weiter. Der Bot hat keinen eigenen offenen Port.
#
# Pflicht-Variablen (in Coolify unter Environment Variables, als Runtime-Variable):
#   BOT_TOKEN     Token von @BotFather
#   BOT_OWNER_ID  deine Telegram-Chat-ID (z. B. von @userinfobot). Nur diese Person wird Besitzer.
# Die Domain wird in Coolify beim Dienst "web" eingetragen (Port 80). Der Dienst "bot" bekommt keine Domain.
services:
  web:
    build: .
    environment:
      BOT_API_URL: /api
    depends_on:
      bot:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_OWNER_ID: ${BOT_OWNER_ID}
      BOT_API_HOST: 0.0.0.0
      BOT_TRUST_PROXY: "true"
      BOT_DATA_FILE: /data/data.json
    volumes:
      - botdata:/data
    expose:
      - "8787"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  botdata:
